            <h1>Quiz</h1>
            <div id="content">
                <!-- I have used the 'figure' semantic element for each question

                which allows for easy formatting -->
                <figure>
                    <h2>Question 1</h2>
                    <img src="images/burrito.jpg" alt="A burrito on display">
                    <h4>What food spot is known for it's burritos that are to-die-for?</h4>
                    <br>
                    <h4><b>Answer (hover):</b></h4>
                    <!-- This p element will be styled 
                    so the answer is hidden until hovered over -->
                    <p class="answer"><b>Grill and Go!</b></p>
                </figure>
                <figure>
                    <h2>Question 2</h2>
                    <img src="images/porter-brook.jpg" alt="The porter brook river in sheffield">
                    <h4>What picnic location is part of the 'Porter Valley Parks', that lie along the course of the Porter Brook river?</h4>
                    <br>
                    <h4><b>Answer (hover):</b></h4>
                    <p class="answer"><b>Endcliffe Park!</b></p>
                </figure>
                <figure>
                    <h2>Question 3</h2>
                    <img src="images/botanical-gardens-quiz.jpg" alt="The sheffield botanical gardens">
                    <h4>What picnic location opened in 1836?</h4>
                    <br>
                    <h4><b>Answer (hover):</b></h4>
                    <p class="answer"><b>The Botanical Gardens!</b></p>
                </figure>
